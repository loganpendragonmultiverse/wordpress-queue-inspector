name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: php -l exporter/wqi-export.php
      - name: Package
        run: |
          mkdir -p dist/wordpress-queue-inspector-${GITHUB_REF_NAME}
          cp -R wqi exporter samples README.md SCHEMA.md DEVELOPMENT.md TESTING.md CHANGELOG.md SECURITY.md LICENSE dist/wordpress-queue-inspector-${GITHUB_REF_NAME}/
          find dist -type d -name __pycache__ -prune -exec rm -rf {} +
          tar -czf dist/wordpress-queue-inspector-${GITHUB_REF_NAME}.tar.gz -C dist wordpress-queue-inspector-${GITHUB_REF_NAME}
          cd dist && sha256sum wordpress-queue-inspector-${GITHUB_REF_NAME}.tar.gz > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/wordpress-queue-inspector-${GITHUB_REF_NAME}.tar.gz dist/SHA256SUMS.txt --title "WordPress Queue Inspector $GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
