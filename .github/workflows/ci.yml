name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m wqi inspect samples/baseline.json
      - run: python -m wqi compare samples/baseline.json samples/followup.json
      - run: php -l exporter/wqi-export.php
        if: runner.os == 'Linux'
      - run: for scenario in healthy action-count-error action-page-error log-count-error cron-error job-boundary; do php -d memory_limit=512M tests/exporter_failures.php "$scenario"; done
        if: runner.os == 'Linux'
